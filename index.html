
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eae9e4">
<title>Residence | Smart Home</title>

<style>
:root {
  --bg: #eae9e4;
  --surface: #f7f6f2;
  --white: #ffffff;
  --ink: #252927;
  --muted: #858982;
  --line: #d9dad3;
  --green: #647b6e;
  --green-light: #e2e9e2;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh;
}

button {
  font: inherit;
  cursor: pointer;
}

main {
  max-width: 1050px;
  margin: auto;
  padding: 32px 24px 60px;
}

/* HEADER */

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 25px;
  border-bottom: 1px solid var(--line);
}

.brand {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .22em;
}

.brand span {
  display: block;
  font-size: 9px;
  font-weight: 400;
  color: var(--muted);
  letter-spacing: .18em;
  margin-top: 5px;
}

.connection {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.dot {
  height: 7px;
  width: 7px;
  border-radius: 50%;
  background: var(--green);
}

/* INTRO */

.intro {
  padding: 43px 0 30px;
}

.eyebrow {
  font-size: 10px;
  letter-spacing: .2em;
  color: var(--muted);
  text-transform: uppercase;
}

h1 {
  font-size: clamp(32px, 6vw, 52px);
  font-weight: 400;
  letter-spacing: -.055em;
  margin: 12px 0;
}

.intro p {
  color: var(--muted);
  font-size: 13px;
}

/* GENERAL CONTROL */

.overview {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 38px;
}

.general {
  background: var(--ink);
  color: white;
  padding: 23px;
  border-radius: 3px;
}

.general small {
  color: #aeb7b0;
  font-size: 10px;
  letter-spacing: .16em;
  text-transform: uppercase;
}

.general h2 {
  font-size: 21px;
  font-weight: 400;
  margin: 12px 0 20px;
}

.actions {
  display: flex;
  gap: 9px;
}

.actions button {
  flex: 1;
  padding: 11px;
  border: 1px solid #626c64;
  background: transparent;
  color: white;
  font-size: 11px;
  border-radius: 2px;
}

.actions button.primary {
  background: var(--green);
  border-color: var(--green);
}

.summary {
  background: var(--surface);
  padding: 23px;
  border: 1px solid var(--line);
  border-radius: 3px;
}

.summary small {
  font-size: 10px;
  letter-spacing: .16em;
  color: var(--muted);
  text-transform: uppercase;
}

.summary strong {
  display: block;
  font-size: 35px;
  font-weight: 400;
  margin: 9px 0 3px;
}

.summary p {
  font-size: 11px;
  color: var(--muted);
  margin: 0;
}

/* FLOORS */

.floor {
  margin-bottom: 40px;
}

.floor-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
  margin-bottom: 15px;
}

.floor-header h2 {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.floor-header span {
  font-size: 10px;
  color: var(--muted);
}

.rooms {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

/* ROOM CARD */

.room {
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 18px;
  min-height: 135px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: .2s;
}

.room.active {
  border-color: var(--green);
  background: #f2f5f0;
}

.room-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}

.room-name {
  font-size: 13px;
  font-weight: 600;
}

.room-number {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: .1em;
}

.room-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 22px;
}

.room-status {
  color: var(--muted);
  font-size: 10px;
}

.room.active .room-status {
  color: var(--green);
}

.toggle {
  width: 39px;
  height: 22px;
  background: #d4d6cf;
  border: 0;
  border-radius: 20px;
  padding: 3px;
  transition: .2s;
}

.toggle::after {
  content: "";
  display: block;
  width: 16px;
  height: 16px;
  background: white;
  border-radius: 50%;
  transition: .2s;
}

.toggle.on {
  background: var(--green);
}

.toggle.on::after {
  transform: translateX(17px);
}

/* FOOTER */

footer {
  border-top: 1px solid var(--line);
  padding-top: 18px;
  color: var(--muted);
  font-size: 10px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.message {
  font-size: 11px;
  color: var(--muted);
  margin: 18px 0;
  min-height: 16px;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

@media(max-width:650px) {
  main {
    padding: 22px 15px 40px;
  }

  .rooms {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }

  .room {
    padding: 14px;
    min-height: 125px;
  }

  .overview {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 36px;
  }
}

@media(max-width:370px) {
  .rooms {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>
<main>

<header>
  <div class="brand">
    RESIDENCE
    <span>SMART HOME SYSTEM</span>
  </div>

  <div class="connection">
    <span class="dot" id="dot"></span>
    <span id="connection">Conectando</span>
  </div>
</header>

<section class="intro">
  <div class="eyebrow">Sistema de automatización residencial</div>
  <h1>Control de iluminación.</h1>
  <p>Gestiona la iluminación de cada espacio de tu vivienda.</p>
</section>

<section class="overview">

  <div class="general">
    <small>Control general</small>
    <h2>Iluminación de la vivienda</h2>

    <div class="actions">
      <button class="primary" id="allOn">
        Encender todo
      </button>

      <button id="allOff">
        Apagar todo
      </button>
    </div>
  </div>

  <div class="summary">
    <small>Estado de iluminación</small>
    <strong id="count">0 / 30</strong>
    <p id="summaryText">Luces encendidas</p>
  </div>

</section>

<div id="floors"></div>

<p class="message" id="message" aria-live="polite"></p>

<footer>
  <span>RESIDENCE © 2026</span>
  <span>ESP32 · SMART LIGHTING</span>
</footer>

</main>

<script>

// DISTRIBUCIÓN DE LOS 30 CANALES
// Los números de LED comienzan en cero.

const floors = [
  {
    name: "Planta alta",
    subtitle: "Nivel 02 · 13 circuitos",
    rooms: [
      {name:"Habitación principal", leds:[0,1]},
      {name:"Vestidor", leds:[2]},
      {name:"Baño principal", leds:[3]},
      {name:"Habitación secundaria", leds:[4,5]},
      {name:"Baño compartido", leds:[6]},
      {name:"Estudio", leds:[7,8]},
      {name:"Pasillo", leds:[9]},
      {name:"Estancia familiar", leds:[10,11]},
      {name:"Escalera", leds:[12]}
    ]
  },
  {
    name: "Planta baja",
    subtitle: "Nivel 01 · 13 circuitos",
    rooms: [
      {name:"Sala de estar", leds:[17,18]},
      {name:"Comedor", leds:[19,20]},
      {name:"Cocina", leds:[21,22]},
      {name:"Medio baño", leds:[23]},
      {name:"Recibidor", leds:[24]},
      {name:"Terraza", leds:[25,26]},
      {name:"Jardín", leds:[27,28]},
      {name:"Pasillo", leds:[29]}
    ]
  },
  {
    name: "Sótano",
    subtitle: "Nivel -01 · 4 circuitos",
    rooms: [
      {name:"Cochera", leds:[13]},
      {name:"Bodega", leds:[14]},
      {name:"Cuarto de máquinas", leds:[15]},
      {name:"Escalera", leds:[16]}
    ]
  }
];

// ESTADO DE LOS LEDS

let states = Array(30).fill(false);
let busy = false;

const floorsContainer = document.getElementById("floors");
const message = document.getElementById("message");

// GENERAR HABITACIONES

floors.forEach((floor, floorIndex) => {

  const section = document.createElement("section");
  section.className = "floor";

  section.innerHTML = `
    <div class="floor-header">
      <h2>${floor.name}</h2>
      <span>${floor.subtitle}</span>
    </div>
    <div class="rooms"></div>
  `;

  const grid = section.querySelector(".rooms");

  floor.rooms.forEach(room => {

    const card = document.createElement("article");
    card.className = "room";

    card.dataset.leds = room.leds.join(",");

    card.innerHTML = `
      <div class="room-top">
        <span class="room-name">${room.name}</span>
        <span class="room-number">
          ${String(room.leds[0]+1).padStart(2,"0")}
        </span>
      </div>

      <div class="room-bottom">
        <span class="room-status">Apagado</span>
        <button class="toggle"
          aria-label="Cambiar iluminación de ${room.name}"
          aria-pressed="false">
        </button>
      </div>
    `;

    grid.appendChild(card);
  });

  floorsContainer.appendChild(section);
});

// ACTUALIZAR INTERFAZ

function draw() {

  let total = 0;

  document.querySelectorAll(".room").forEach(card => {

    const leds = card.dataset.leds.split(",").map(Number);

    const on = leds.every(i => states[i]);
    const some = leds.some(i => states[i]);

    if (some) total += leds.filter(i => states[i]).length;

    card.classList.toggle("active", on);

    const toggle = card.querySelector(".toggle");
    const status = card.querySelector(".room-status");

    toggle.classList.toggle("on", on);
    toggle.setAttribute("aria-pressed", String(on));

    status.textContent = on
      ? "Encendido"
      : some ? "Parcial" : "Apagado";
  });

  document.getElementById("count").textContent =
    `${total} / 30`;

  document.getElementById("summaryText").textContent =
    "Luces encendidas";
}

// COMUNICACIÓN CON ESP32

async function request(path) {

  if (busy) return;

  busy = true;
  message.textContent = "Actualizando iluminación...";

  document.querySelectorAll("button").forEach(b => {
    b.disabled = true;
  });

  try {

    const response = await fetch(path, {
      cache: "no-store"
    });

    if (!response.ok) throw Error();

    const data = await response.json();

    states = data.state.map(Boolean);

    draw();

    message.textContent = "Sistema actualizado.";
    setConnection(true);

  } catch(error) {

    message.textContent =
      "No se pudo conectar con el ESP32.";

    setConnection(false);

  } finally {

    busy = false;

    document.querySelectorAll("button").forEach(b => {
      b.disabled = false;
    });
  }
}

// CONTROL INDIVIDUAL DE HABITACIONES

document.querySelectorAll(".room").forEach(card => {

  card.querySelector(".toggle").addEventListener("click", async () => {

    if (busy) return;

    const leds = card.dataset.leds.split(",").map(Number);

    const turnOn = !leds.every(i => states[i]);

    busy = true;
    message.textContent = "Actualizando habitación...";

    document.querySelectorAll("button").forEach(b => {
      b.disabled = true;
    });

    try {

      await Promise.all(leds.map(async led => {

        const response = await fetch(
          `/api/led?led=${led}&on=${turnOn ? 1 : 0}`,
          {cache:"no-store"}
        );

        if (!response.ok) throw Error();
      }));

      const response = await fetch("/api/state", {
        cache:"no-store"
      });

      if (!response.ok) throw Error();

      const data = await response.json();

      states = data.state.map(Boolean);

      draw();
      setConnection(true);
      message.textContent = "Habitación actualizada.";

    } catch(error) {

      message.textContent =
        "Error al controlar la habitación.";

      setConnection(false);

    } finally {

      busy = false;

      document.querySelectorAll("button").forEach(b => {
        b.disabled = false;
      });
    }
  });
});

// CONTROL GENERAL

document.getElementById("allOn").addEventListener(
  "click", () => request("/api/all?on=1")
);

document.getElementById("allOff").addEventListener(
  "click", () => request("/api/all?on=0")
);

// CONEXIÓN

function setConnection(connected) {

  document.getElementById("connection").textContent =
    connected ? "En línea" : "Sin conexión";

  document.getElementById("dot").style.background =
    connected ? "#647b6e" : "#c46c61";
}

// CONSULTA INICIAL

(async () => {

  try {

    const response = await fetch("/api/state", {
      cache:"no-store"
    });

    if (!response.ok) throw Error();

    const data = await response.json();

    states = data.state.map(Boolean);

    draw();
    setConnection(true);

  } catch(error) {

    setConnection(false);
    message.textContent =
      "No se pudo leer el estado del sistema.";

  }

})();

</script>
</body>
</html>
